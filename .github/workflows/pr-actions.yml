name: Actions Test

on:
  push:
    branches:
      - main

jobs:
  test:
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Metal
        run: |
          DEVELOPER_DIR="/Applications/Xcode_26.3.app" xcodebuild -version
          mkdir download
          DEVELOPER_DIR="/Applications/Xcode_26.3.app" xcodebuild -downloadComponent metalToolchain -exportPath download/
          ls -al download
      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          path: download/*
